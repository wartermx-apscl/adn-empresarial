<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EEF8">
</head>
<body>
<title>Pinta y Multiplica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: estudio de pintura — pared lila punteada, hojas de papel con contorno de tinta como un libro para colorear; lienzo y paleta lado a lado en horizontal, apilados en vertical. Un solo tema claro, a propósito: el papel siempre es papel. */
:root{
  --wall:#F1EEF8;
  --paper:#FFFFFF;
  --ink:#2A2450;
  --ink-2:#5E5885;
  --ink-faint:#BDB6D8;
  --line:#DAD4EA;
  --pink:#F2456A; --pink-soft:#FFE4EA; --pink-deep:#B8213F;
  --teal:#11968B; --teal-soft:#D8F4F0;
  --sun:#FFC23D; --sun-soft:#FFF1C9; --sun-deep:#D99A00; --sun-ink:#8A5F00;
  --sky:#3D7BF0;
  --grape:#7A52E0; --grape-soft:#EEE8FF;
  --peach:#FFD3B5;
  --ok:#1C9A57; --ok-soft:#DCF5E7;
  --bad:#D63C4A;
  --st-new:#ECE8F5; --st-hard:#FF8F86; --st-learn:#FFD36B; --st-done:#4CC38A;
  --bar-bg:rgba(241,238,248,.94);
  --scrim:rgba(42,36,80,.5);
  --f-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-m:18px; --r-l:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
[hidden]{display:none!important}
body{background-color:var(--wall);background-image:radial-gradient(rgba(122,82,224,.09) 1.3px,transparent 1.5px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.08;margin:0;text-wrap:balance}
p,ul,figure{margin:0}
ul{padding:0;list-style:none}
.muted{color:var(--ink-2)}
.small{font-size:.92rem}
.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.i.solid{fill:currentColor;stroke:none}
.h-l{font-size:clamp(1.8rem,4.4vw,2.6rem)}
.h-m{font-size:clamp(1.3rem,3vw,1.6rem)}
.h-s{font-size:1.2rem}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* barra superior */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wall)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;white-space:nowrap;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.bar-sp{flex:1}
.stars-pill{display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:999px;background:var(--sun);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.stars-pill .i{width:1.25em;height:1.25em}
.stars-pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.2) rotate(-5deg)}60%{transform:scale(.95)}}
.icon-btn{width:46px;height:46px;flex:none;border-radius:50%;display:inline-grid;place-items:center;background:var(--paper);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--f-display);font-size:1.7rem;font-weight:800;line-height:1}
.icon-btn .i{width:24px;height:24px}
@media (max-width:480px){.brand span{display:none}}

/* base de pantallas */
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;gap:20px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r-l);box-shadow:0 5px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.12rem;line-height:1.1;text-align:center}
.btn.primary{background:var(--pink);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.sun{background:var(--sun)}
.btn.small{min-height:42px;padding:0 16px;font-size:1rem;box-shadow:0 3px 0 var(--ink)}
.btn.big{min-height:66px;font-size:1.5rem;padding:0 32px}
.btn.big .i{width:30px;height:30px}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.btn:active,.icon-btn:active,.key:active,.stars-pill:active,.tile:active,.pick:active,.tcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row-btns{display:flex;flex-wrap:wrap;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.sec-head > div{display:grid;gap:6px;min-width:0}
.sec-sub{margin-top:8px}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding:28px}
.hello{font-family:var(--f-display);font-weight:700;font-size:1.35rem;color:var(--teal)}
.logo{font-size:clamp(2.7rem,7.2vw,4.8rem);letter-spacing:-.01em;line-height:.92;margin:4px 0 14px}
.logo .lm{display:block;color:var(--ink)}
.lead{font-size:1.12rem;max-width:36ch;color:var(--ink-2)}
.hero-cta{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px}
.easel{position:relative;padding:14px;background:var(--sun-soft);border:2px solid var(--ink);border-radius:22px;transform:rotate(2deg);box-shadow:0 5px 0 var(--ink)}
.easel svg{display:block;width:100%;height:auto}
.easel-note{position:absolute;left:-14px;bottom:18px;transform:rotate(-6deg);background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:4px 12px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 var(--ink)}
.name-form{margin-top:20px;display:grid;gap:6px;max-width:380px}
.name-form label{font-weight:800}
.nf-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nf-row input{flex:1;min-width:0;height:50px;border-radius:14px;border:2px solid var(--ink);padding:0 14px;font-size:1.1rem;background:var(--paper)}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding:20px;gap:22px}.easel{max-width:300px;justify-self:center}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;text-align:left;min-height:172px}
.tile-ic{position:relative;z-index:1;width:58px;height:58px;border-radius:18px 22px 16px 20px;display:grid;place-items:center;border:2px solid var(--ink);background:var(--tc);color:var(--tic);margin-bottom:8px}
.tile-ic .i{width:30px;height:30px}
.tile h2{position:relative;z-index:1;font-size:1.32rem}
.tile p{position:relative;z-index:1;color:var(--ink-2);font-size:.98rem}
.tile .splat{position:absolute;right:-30px;bottom:-34px;width:120px;height:120px;opacity:.28;fill:var(--tc)}
.practice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px}
.practice > div:first-child{display:grid;gap:2px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{width:50px;height:50px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--ink-2);transition:transform .12s}
.tchip[aria-pressed="true"]{background:var(--c);color:var(--ct);box-shadow:0 3px 0 var(--ink)}
.reward{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 18px;border-radius:var(--r-m);background:var(--sun-soft);border:2px dashed var(--sun-deep);font-weight:700}
.reward .i{width:28px;height:28px;color:var(--sun-deep)}
.rw-txt{flex:1;min-width:200px}
.rw-bar{width:160px;height:14px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);overflow:hidden}
.rw-bar i{display:block;height:100%;background:var(--sun)}

/* elegir dibujo */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.pick{display:flex;flex-direction:column;gap:6px;padding:12px;text-align:left}
.pick .thumb{width:100%;height:auto;border-radius:16px}
.pick-name{font-family:var(--f-display);font-weight:800;font-size:1.3rem;padding:0 4px}
.pick-meta{display:flex;align-items:center;gap:6px;color:var(--ink-2);padding:0 4px 4px;font-weight:700;font-size:.95rem}
.pick.locked .thumb{filter:grayscale(1) opacity(.4)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-weight:800;font-size:.9rem}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.ovr{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}

/* pintar */
.paint-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.ph-title{display:grid;gap:8px;min-width:0}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--ink-2)}
.prog-bar{width:180px;height:16px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#FF4D5E,#FFD43B,#2FB565,#3D6BF2);transition:width .4s}
.ph-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;background:var(--grape-soft);border:2px solid var(--grape);color:var(--grape);font-weight:800}
.paint{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:18px;align-items:start}
.canvas-card{padding:14px;display:grid;gap:10px}
.guide{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;justify-content:center;font-weight:800;color:var(--ink-2)}
.guide span{display:inline-flex;align-items:center;gap:6px}
.guide b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pink);color:#fff;font-family:var(--f-display)}
.art{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
.art.big{max-width:min(100%,max(300px,calc(100vh - 230px)));margin:0 auto;touch-action:manipulation}
@supports (height:100dvh){.art.big{max-width:min(100%,max(300px,calc(100dvh - 230px)))}}
.art .rg{stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;transition:fill .3s ease;transform-box:fill-box;transform-origin:center}
.art.big .rg{cursor:pointer}
.art .rg.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.035)}}
.art .rg.asking{stroke:var(--pink);stroke-dasharray:12 8;animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-40}}
.art .decor{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.art .decor .thin{stroke-width:3}
.art .decor .dash{stroke-dasharray:2 8}
.art .decor .ink{fill:var(--ink);stroke:none}
.art .decor .shine{fill:var(--paper);stroke:none}
.art .splash{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:splash .6s ease-out forwards}
@keyframes splash{from{transform:scale(.1);opacity:.85}to{transform:scale(1.5);opacity:0}}
@media (hover:hover){.art.big .rg:not(.on):hover{fill:#F4F0FF!important}}
.palette{padding:16px;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.pal-title{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:10px}
.sw{position:relative;aspect-ratio:1;width:100%;max-width:100%;border-radius:50% 46% 52% 48%/48% 52% 46% 54%;background:var(--sw);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);overflow:hidden;transition:transform .12s}
.sw svg{display:block;width:100%;height:100%}
.sw[aria-pressed="true"]{transform:scale(1.1);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--pink)}
.sw.locked{background:var(--st-new);border-style:dashed;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-2)}
.sw.locked .i{width:18px;height:18px}
.sw .need{font-size:.72rem;font-weight:900;line-height:1}
.brush-now{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:2px dashed var(--line);font-weight:700}
.bn-dot{width:32px;height:32px;flex:none}
@media (max-width:860px),(orientation:portrait){
  .paint{grid-template-columns:1fr}
  .art.big{max-width:min(100%,max(300px,calc(100vh - 420px)),720px)}
  .palette{position:static}
  .swatches{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
}
@media (max-width:860px) and (min-height:1px),(orientation:portrait) and (min-height:1px){
  @supports (height:100dvh){.art.big{max-width:min(100%,max(300px,calc(100dvh - 420px)),720px)}}
}

/* hoja de pregunta */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(780px,100%);max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-l);box-shadow:0 8px 0 var(--ink);padding:22px;animation:rise .25s ease}
@keyframes rise{from{transform:translateY(24px) scale(.97)}}
.sheet-x{position:absolute;top:12px;right:12px}
.q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,290px);gap:22px;align-items:start}
.q-side{padding-top:52px}
@media (max-width:660px){.q{grid-template-columns:1fr;gap:14px}.q-side{padding-top:0}}
.q-main{display:grid;gap:12px;min-width:0}
.q-top{display:flex;flex-wrap:wrap;gap:8px;padding-right:52px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;font-weight:800;background:var(--c);color:var(--ct);border:2px solid var(--ink)}
.tag.ghost{background:var(--paper);color:var(--ink)}
.dot-c{width:20px;height:20px;flex:none}
.eq{display:flex;align-items:center;justify-content:center;gap:.22em;flex-wrap:wrap;font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,10vw,4.8rem);line-height:1.1;font-variant-numeric:tabular-nums;padding:6px 0}
.eq .op{color:var(--ink-2)}
.ans{min-width:1.9em;padding:0 .15em;text-align:center;border-bottom:6px solid var(--ink);color:var(--pink)}
.ans.empty{color:var(--ink-faint)}
.ans.wake{animation:wake .9s ease}
@keyframes wake{15%{transform:scale(1.2) rotate(-5deg)}30%{transform:scale(1.2) rotate(5deg)}45%{transform:scale(1.12) rotate(-3deg)}65%{transform:none}}
.hint-btn.wake{animation:glow 1.1s ease 3}
@keyframes glow{50%{background:var(--sun);transform:scale(1.04)}}
.streak{display:inline-block;margin-left:6px;padding:1px 10px;border-radius:999px;background:var(--sun);color:var(--ink);border:2px solid var(--ink)}
.q-say{width:40px;height:40px;box-shadow:0 2px 0 var(--ink)}
.q-say .i{width:20px;height:20px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper);box-shadow:0 3px 0 var(--ink)}
.seg button{min-height:42px;padding:0 16px;font-weight:800}
.seg button + button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.focus-list{display:grid;gap:10px;counter-reset:none}
.focus-list li{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--teal-soft)}
.focus-list b{font-family:var(--f-display);font-size:1.12rem}
.eq.good .ans{color:var(--ok);border-color:var(--ok)}
.eq.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.fb{text-align:center;font-weight:800;font-size:1.12rem;min-height:1.6em;color:var(--ink-2)}
.fb.good{color:var(--ok)}
.fb.bad{color:var(--bad)}
.q-side{display:grid;gap:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:64px;border-radius:18px;background:var(--paper);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.9rem;display:grid;place-items:center}
.key .i{width:30px;height:30px}
.key.ok{background:var(--teal);color:#fff}
.key.del{background:var(--pink-soft)}
.hint-btn{width:100%;background:var(--grape-soft)}
.hint{border:2px dashed var(--grape);background:var(--grape-soft);border-radius:var(--r-m);padding:14px;display:grid;gap:10px;animation:rise .25s}
.h-head{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;color:var(--grape);font-size:1.1rem}
.h-txt{font-size:1.05rem}
.h-txt b{font-family:var(--f-display);font-size:1.15em}
.h-extra{font-size:.98rem;color:var(--ink-2);font-weight:700}
.dots-wrap{display:grid;gap:10px;overflow-x:auto;padding-bottom:2px}
.dgroup{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:grid;gap:4px}
.dots i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:var(--dc)}
.dlabel{font-family:var(--f-display);font-weight:800;color:var(--dc);font-size:1.1rem}

/* reto rápido */
.drops{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.drop{width:34px;height:44px;transform-origin:50% 80%}
.drop path{fill:var(--paper);stroke:var(--ink);stroke-width:2.2}
.drop.full path{fill:var(--dc)}
.drop.fixed path{fill:var(--dc);fill-opacity:.35}
.drop.now path{stroke:var(--pink);stroke-dasharray:4 3}
.drop.full{animation:pop .4s}
.quiz-card{padding:22px}
.qend{display:grid;gap:12px;justify-items:start}
.qend-big{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1}
.qend-big b{font-size:1.6em;color:var(--pink)}
.review{display:grid;gap:8px;width:100%}
.review li{display:grid;gap:2px;padding:10px 14px;border-radius:14px;background:var(--grape-soft)}
.rv-eq{font-family:var(--f-display);font-weight:800;font-size:1.3rem}

/* trucos */
.tricks-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}
@media (max-width:820px){.tricks-top{grid-template-columns:1fr}}
.flip-card,.board-card{padding:20px;display:grid;gap:12px;align-content:start}
.flip-stage{height:180px;display:grid;place-items:center;background:var(--sun-soft);border-radius:var(--r-m);border:2px dashed var(--sun-deep);overflow:hidden}
.flip-grid{display:grid;grid-template-columns:repeat(5,24px);gap:8px;transition:transform .6s cubic-bezier(.5,1.6,.5,1)}
.flip-grid.flipped{transform:rotate(90deg)}
.flip-grid i{width:24px;height:24px;border-radius:50%;background:var(--pink);display:block}
.flip-grid i:nth-child(n+6){background:var(--sky)}
.flip-grid i:nth-child(n+11){background:var(--teal)}
.flip-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.flip-eq{font-family:var(--f-display);font-weight:800;font-size:1.45rem}
.mb-btns{display:flex;flex-wrap:wrap;gap:6px}
.mb-btns .tchip{width:44px;height:44px;font-size:1.15rem}
.mb-wrap{max-width:380px;width:100%}
.mb{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.mb span{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-size:.72rem;font-weight:900;transition:background .3s}
.mb span.lit{background:var(--c)}
.mb span.left{background:var(--paper);border:2px dashed var(--pink);color:var(--pink)}
.mb-count{font-weight:700;font-size:1.08rem}
.mb-count b{font-family:var(--f-display);font-size:1.4em;color:var(--pink)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.tcard{display:flex;align-items:center;gap:14px;padding:14px;text-align:left}
.tnum{flex:none;width:64px;height:64px;border-radius:20px 24px 18px 22px;display:grid;place-items:center;background:var(--c);border:2px solid var(--ink);font-family:var(--f-display);font-weight:800;font-size:2.2rem}
.tc-body{display:grid;gap:2px;min-width:0}
.tc-name{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.tc-tip{color:var(--ink-2);font-size:.95rem}
.tc-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.lvl{font-size:.75rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.lvl-f{background:var(--ok-soft);color:var(--ok)}
.lvl-m{background:var(--sun-soft);color:var(--sun-ink)}
.lvl-r{background:var(--pink-soft);color:var(--pink-deep)}
.mini{display:flex;gap:2px}
.mini i{width:9px;height:9px;border-radius:3px;background:var(--st-new)}
.mini.big{gap:4px;margin-top:8px}
.mini.big i{width:16px;height:16px;border-radius:5px}
.mini i.st-done{background:var(--st-done)}
.mini i.st-learn{background:var(--st-learn)}
.mini i.st-hard{background:var(--st-hard)}

/* detalle de tabla */
.t-hero{display:flex;align-items:center;gap:20px;padding:20px;flex-wrap:wrap}
.t-hero > div{display:grid;gap:4px;min-width:0}
.t-big{flex:none;width:110px;height:110px;border-radius:30px 36px 28px 34px;display:grid;place-items:center;background:var(--c);border:3px solid var(--ink);font-family:var(--f-display);font-weight:800;font-size:4rem;box-shadow:0 5px 0 var(--ink)}
.t-short{font-size:1.15rem;font-weight:800;color:var(--ink-2)}
.t-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.t-grid{grid-template-columns:1fr}}
.t-col{display:grid;gap:18px}
.tip{position:relative;background:var(--sun-soft);border:2px solid var(--ink);border-radius:6px;padding:18px 18px 16px;display:grid;gap:6px;box-shadow:0 4px 0 var(--ink);transform:rotate(-.6deg)}
.tip:nth-child(even){transform:rotate(.6deg);background:var(--teal-soft)}
.tip::before{content:"";position:absolute;top:-11px;left:50%;width:74px;height:20px;margin-left:-37px;background:rgba(255,255,255,.75);border:1px solid var(--line);transform:rotate(-3deg)}
.play{padding:18px;display:grid;gap:10px}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:4px 0}
.stepper .icon-btn{width:56px;height:56px;font-size:2rem}
.st-eq{font-family:var(--f-display);font-weight:800;font-size:2rem;min-width:6.5em;text-align:center;font-variant-numeric:tabular-nums}
.st-eq b{color:var(--pink)}
.hands{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:150px;padding-top:10px;margin-bottom:30px}
.finger{flex:1 1 0;min-width:0;max-width:36px;height:var(--h);border-radius:18px 18px 10px 10px;background:var(--peach);border:2px solid var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;padding-top:5px;transition:height .25s,background .25s}
.finger:nth-child(5){margin-right:16px}
.nail{width:60%;height:14px;border-radius:9px 9px 5px 5px;background:rgba(255,255,255,.7);border:1.5px solid var(--ink)}
.fnum{position:absolute;bottom:-30px;font-family:var(--f-display);font-weight:800;color:var(--ink-2)}
.finger.l{background:var(--pink)}
.finger.r{background:var(--teal)}
.finger.down{height:30px;background:var(--st-new)}
.finger.down .nail{display:none}
.tlist-card{padding:18px;display:grid;gap:10px}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tlist{display:grid;gap:6px}
.tl-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 14px;border-radius:14px;background:var(--wall);font-family:var(--f-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;text-align:left}
.tl-row.open{background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.tl-row.speaking{box-shadow:inset 0 0 0 3px var(--pink)}
.cover{display:inline-grid;place-items:center;min-width:56px;height:38px;border-radius:12px;background:var(--grape);color:#fff;font-size:1.2rem}
.tl-row:not(.open) .val{display:none}
.tl-row.open .cover{display:none}
.val{display:inline-flex;align-items:baseline;gap:10px}
.val small{font-family:var(--f-body);font-size:.85rem;font-weight:800;color:var(--ink-2)}
.pt-a{color:var(--pink)}
.pt-b{color:var(--teal)}
.pat-note{font-weight:700;color:var(--ink-2)}
.t-actions{display:grid;gap:12px}

/* mis obras */
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.work{padding:10px;display:grid;gap:8px;transform:rotate(-1deg)}
.work:nth-child(3n+2){transform:rotate(1.2deg)}
.work:nth-child(3n){transform:rotate(-.4deg)}
.work .thumb{border-radius:14px}
.work figcaption{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;padding:0 4px 4px}
.work figcaption span{color:var(--ink-2);font-size:.9rem}
.empty{padding:28px;display:grid;gap:14px;justify-items:start}

/* papás */
.p-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.p-grid{grid-template-columns:1fr}}
.p-card{padding:20px;display:grid;gap:12px;box-shadow:0 3px 0 var(--ink)}
.p-side{display:grid;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:540px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:10px 12px;border-radius:14px;background:var(--wall);display:grid;gap:4px}
.stat b{font-family:var(--f-display);font-size:1.9rem;line-height:1}
.stat span{font-size:.85rem;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sq{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.heat-wrap{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:3px;margin:0 auto;font-variant-numeric:tabular-nums}
.heat th{font-family:var(--f-display);font-weight:800;color:var(--ink-2);font-size:.95rem;width:34px;height:30px;padding:0}
.heat td{padding:0}
.hc{width:36px;height:34px;border-radius:7px;font-size:.8rem;font-weight:800;color:var(--ink)}
.st-new{background:var(--st-new)}
.st-hard{background:var(--st-hard)}
.st-learn{background:var(--st-learn)}
.st-done{background:var(--st-done)}
.hc.sel{outline:3px solid var(--ink);outline-offset:1px}
@media (max-width:540px){.hc{width:27px;height:27px;font-size:.66rem;border-radius:5px}.heat th{width:22px;font-size:.8rem}.heat{border-spacing:2px}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem;font-weight:700;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.heat-info{font-weight:700;min-height:1.5em}
.summary-line{font-weight:700;color:var(--ink-2)}
.hard-list{display:grid;gap:8px}
.hard-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--pink-soft);flex-wrap:wrap}
.hard-list b{font-family:var(--f-display);font-size:1.25rem}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-display);font-weight:800}
.order span{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:10px;border:2px solid var(--ink);background:var(--c);color:var(--ct)}
.order em{font-style:normal;color:var(--ink-2);padding:0 2px}
.advice{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.adv{padding:16px 18px;display:grid;gap:6px;align-content:start;box-shadow:none;border-color:var(--line);border-radius:var(--r-m)}
.adv p{color:var(--ink-2)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:2px dashed var(--line);font-weight:700}
.set-row label{font-weight:800}

/* celebración, confirmación, aviso */
.cel-sheet{width:min(560px,100%);text-align:center;display:grid;gap:12px;justify-items:center}
#cel-art{width:min(320px,78%)}
#cel-art svg{border-radius:18px}
.small-sheet{width:min(470px,100%);display:grid;gap:18px}
.cf-t{font-size:1.2rem;font-weight:800}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;width:max-content;max-width:calc(100% - 32px);padding:12px 20px;border-radius:22px;background:var(--ink);color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(42,36,80,.25);text-align:center}
#toast.show{animation:toastin .3s ease}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

/* ---------- Pinturas ---------- */
var COLORS=[
 ['#FF4D5E','Rojo fresa'],['#FF9A3C','Naranja'],['#FFD43B','Amarillo'],['#9BE15D','Verde limón'],
 ['#2FB565','Verde'],['#22C7B8','Turquesa'],['#5BC4FF','Azul cielo'],['#3D6BF2','Azul'],
 ['#8F5CF7','Morado'],['#D98CFF','Lila'],['#FF7DB8','Rosa'],['#FFC8A2','Durazno'],
 ['#A86B3C','Café'],['#FFFFFF','Blanco'],['#3A3550','Gris noche']
];
var MAGIC=[
 {id:'oro',name:'Oro brillante',need:5},
 {id:'arcoiris',name:'Arcoíris',need:12},
 {id:'estrellas',name:'Estrellitas',need:22},
 {id:'rayas',name:'Rayitas',need:34},
 {id:'lunares',name:'Lunares',need:48},
 {id:'galaxia',name:'Galaxia',need:65}
];
function colorName(c){var h=COLORS.filter(function(x){return x[0]===c;})[0];if(h)return h[1];var m=MAGIC.filter(function(x){return x.id===c;})[0];return m?m.name:'';}
function fillOf(c){return c?(c.charAt(0)==='#'?c:'url(#p-'+c+')'):'#FFFFFF';}

/* ---------- Dibujos (contornos estilo libro para colorear, viewBox 400×400) ---------- */
var BG='<rect x="6" y="6" width="388" height="388" rx="28"/>';
var BR=' V366 Q394 394 366 394 H34 Q6 394 6 366 Z';

  d.regions.forEach(function(r,i){var f=fills[i];s+='<g class="rg'+(f?' on':'')+'" data-i="'+i+'" style="fill:'+fillOf(f)+'">'+r+'</g>';});
  return s+'<g class="decor">'+d.decor+'</g></svg>';
}

/* ---------- Estrategias y pistas ---------- */
function strategy(t,m){
  var p=t*m,G=function(rows,color){return {rows:rows,color:color};},r;
  switch(t){
    case 1:r={groups:[G(1,GS)],text:'Por 1 el número se queda igual: <b>1 × '+m+' = '+m+'</b>.'};break;
    case 2:r={groups:[G(1,GA),G(1,GB)],text:'Es el doble: <b>'+m+' + '+m+' = '+p+'</b>.'};break;
    case 3:r={groups:[G(2,GA),G(1,GB)],text:'El doble y uno más: <b>'+(2*m)+' + '+m+' = '+p+'</b>.'};break;
    case 4:r={groups:[G(2,GA),G(2,GB)],text:'El doble del doble: <b>'+m+' → '+(2*m)+' → '+p+'</b>.'};break;
    case 5:r={groups:[G(5,GS)],text:m%2===0?'La mitad de '+m+' es '+(m/2)+', ponle un cero: <b>'+p+'</b>.':'Cuenta de 5 en 5: <b>'+range(1,m).map(function(i){return 5*i;}).join(', ')+'</b>.'};break;
    case 6:r={groups:[G(5,GA),G(1,GB)],text:'La del 5 y uno más: <b>'+(5*m)+' + '+m+' = '+p+'</b>.'};break;
    case 7:r={groups:[G(5,GA),G(2,GB)],text:'La del 5 más la del 2: <b>'+(5*m)+' + '+(2*m)+' = '+p+'</b>.'};break;
    case 8:r={groups:[G(4,GA),G(4,GB)],text:'Doble, doble y doble: <b>'+m+' → '+(2*m)+' → '+(4*m)+' → '+p+'</b>.'};break;
    case 9:r={groups:[G(9,GS)],text:'Es 10 × '+m+' menos '+m+': <b>'+(10*m)+' − '+m+' = '+p+'</b>.'};break;
    default:r={groups:[G(10,GS)],text:'Ponle un cero al '+m+': <b>'+p+'</b>.'};
  }
  var x='';
  if(t===m&&t>1)x='¡Es un cuadrado! '+t+' filas de '+t+' forman un cuadrado perfecto.';
  if(t===9&&p>=10){var s=String(p);x='Truco: las cifras de '+p+' suman 9 ('+s[0]+' + '+s[1]+' = 9). También sirve el truco de los dedos.';}
  if(t===6&&m%2===0)x='Truco: 6 por un número par termina en ese número: 6 × '+m+' = '+p+'.';
  if((t===7&&m===8)||(t===8&&m===7))x='Truco: 5, 6, 7, 8 → 56 = 7 × 8.';
  r.extra=x;return r;
}
function dotsHTML(rows,cols,groups){
  var d=rows*cols>60?11:14;
  return '<div class="dots-wrap" style="--d:'+d+'px">'+groups.map(function(g){return '<div class="dgroup" style="--dc:'+g.color+'"><div class="dots" style="grid-template-columns:repeat('+cols+','+d+'px)">'+new Array(g.rows*cols+1).join('<i></i>')+'</div><span class="dlabel">'+g.rows+' × '+cols+' = '+(g.rows*cols)+'</span></div>';}).join('')+'</div>';
}
function hintHTML(a,b){
  var e=easier(a,b),t=e[0],m=e[1],s=strategy(t,m);
  var filas=t===1?'1 fila':t+' filas';
  var intro=(t!==a)?'<p class="h-txt"><b>'+a+' × '+b+'</b> es lo mismo que <b>'+t+' × '+m+'</b>: '+filas+' de '+m+' puntitos.</p>':'<p class="h-txt">Imagina <b>'+filas+'</b> de <b>'+m+'</b> puntitos.</p>';
  return '<div class="h-head"><svg class="i"><use href="#i-bulb"/></svg> Pista</div>'+intro+dotsHTML(t,m,s.groups)+'<p class="h-txt">'+s.text+'</p>'+(s.extra?'<p class="h-extra">'+s.extra+'</p>':'');
}

/* ---------- Elegir multiplicación (repite más las que cuestan) ---------- */
function pickFact(tables){
  var list=[],total=0;
  tables.forEach(function(t){for(var m=1;m<=10;m++){var k=fk(t,m),f=state.facts[k],w=f?Math.pow(6-f.b,2):14;if(f&&f.w>f.c)w*=1.6;if(recent.indexOf(k)>=0)w*=0.04;list.push({t:t,m:m,w:w});total+=w;}});
  var r=Math.random()*total,pk=list[list.length-1];
  for(var i=0;i<list.length;i++){r-=list[i].w;if(r<=0){pk=list[i];break;}}
  recent.push(fk(pk.t,pk.m));if(recent.length>4)recent.shift();
  var swap=pk.t!==pk.m&&Math.random()<0.3;
  return {t:pk.t,m:pk.m,a:swap?pk.m:pk.t,b:swap?pk.t:pk.m};
}
function record(a,b,first,hint){
  var k=fk(a,b),f=state.facts[k]||(state.facts[k]={c:0,w:0,b:0,t:0});
  if(first){f.c++;if(!hint)f.b=Math.min(5,f.b+1);}else{f.w++;f.b=Math.max(0,f.b-2);}
  f.t=Date.now();state.answered++;if(first)state.firstTry++;save();
}

/* ---------- Pregunta con teclado grande ---------- */
function mountQuestion(root,opts){
  var f=pickFact(opts.tables),q={a:f.a,b:f.b,t:f.t,ans:f.a*f.b,typed:'',tries:0,hint:false,revealed:false,done:false};
  root.innerHTML='<div class="q"><div class="q-main">'+
    '<div class="q-top"><button class="icon-btn q-say" data-act="sayQ" aria-label="Escuchar la pregunta"><svg class="i"><use href="#i-sound"/></svg></button><span class="tag" style="--c:'+TCOL[f.t]+';--ct:'+tTxt(f.t)+'">Tabla del '+f.t+'</span>'+(opts.color?'<span class="tag ghost"><svg viewBox="0 0 20 20" class="dot-c" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="'+fillOf(opts.color)+'" stroke="#2A2450" stroke-width="2"/></svg>Pintarás con '+colorName(opts.color)+'</span>':'')+'</div>'+
    '<div class="eq" id="q-eq" aria-label="'+f.a+' por '+f.b+'"><span>'+f.a+'</span><span class="op">×</span><span>'+f.b+'</span><span class="op">=</span><span class="ans empty" id="q-ans">?</span></div>'+
    '<p class="fb" id="q-fb" aria-live="polite">Escribe tu respuesta con los números.</p>'+
    '<div class="hint" id="q-hint" hidden></div></div>'+
    '<div class="q-side"><div class="keys">'+range(1,9).map(function(n){return '<button class="key" data-act="key" data-v="'+n+'">'+n+'</button>';}).join('')+
    '<button class="key del" data-act="key" data-v="del" aria-label="Borrar"><svg class="i"><use href="#i-del"/></svg></button><button class="key" data-act="key" data-v="0">0</button><button class="key ok" data-act="key" data-v="ok" aria-label="Revisar"><svg class="i"><use href="#i-check"/></svg></button></div>'+
    '<button class="btn small hint-btn" data-act="hint" id="q-hintbtn"><svg class="i"><use href="#i-bulb"/></svg> Dame una pista</button></div></div>';
  var ansEl=$('#q-ans',root),fb=$('#q-fb',root),hintEl=$('#q-hint',root),eq=$('#q-eq',root),hb=$('#q-hintbtn',root);
  function show(){ansEl.textContent=q.typed||'?';ansEl.classList.toggle('empty',!q.typed);}
  function showHint(){q.hint=true;hintEl.innerHTML=hintHTML(q.a,q.b);hintEl.hidden=false;hb.hidden=true;}
  function sayQ(lead){return say((lead||'')+q.a+' por '+q.b+'?');}
  /* Si se queda quieta: la respuesta se mueve, la llama por su nombre y, a la segunda, resalta la pista */
  var idleT=null,nudges=0;
  function arm(){clearTimeout(idleT);if(nudges<3)idleT=setTimeout(nudge,nudges===0?12000:16000);}
  function nudge(){
    if(activeQ!==ctl||q.done)return;
    nudges++;ansEl.classList.remove('wake');void ansEl.offsetWidth;ansEl.classList.add('wake');
    fb.className='fb';fb.innerHTML=(nudges===1?'¿Sigues ahí'+(state.name?', '+esc(state.name):'')+'? ':'¡Tú puedes! ')+'¿Cuánto es <b>'+q.a+' × '+q.b+'</b>?';
    sfx('ping');if(state.sound)sayQ(nudges===1&&state.name?state.name+', ¿cuánto es ':'¿Cuánto es ');
    if(nudges>=2&&!q.hint){hb.classList.remove('wake');void hb.offsetWidth;hb.classList.add('wake');}
    arm();
  }
  function check(){
    if(q.done||!q.typed)return;
    if(parseInt(q.typed,10)===q.ans){
      q.done=true;clearTimeout(idleT);var first=q.tries===0;
      record(q.a,q.b,first,q.hint);sessionN++;
      streak=first?streak+1:0;
      var big=first&&streak>=3&&(streak===3||streak%5===0);
      eq.classList.add('good');fb.className='fb good';
      fb.innerHTML=first?praise()+' <b>+1 ★</b>'+(big?' <span class="streak">¡'+streak+' seguidas!</span>':''):'¡Eso es! '+q.a+' × '+q.b+' = '+q.ans+'. ¡Ya casi te la sabes!';
      sfx(big?'streak':'good');if(first)addStars(1);
      if(sessionN%10===0)setTimeout(function(){toast('¡Llevas '+sessionN+' multiplicaciones! Pausa de pintora: estírate como gatito y regresa.');},1100);
      setTimeout(function(){if(activeQ!==ctl)return;activeQ=null;opts.onDone({a:q.a,b:q.b,first:first,hint:q.hint});},first?(big?1300:900):1400);
    }else{
      q.tries++;streak=0;sfx('bad');eq.classList.remove('shake');void eq.offsetWidth;eq.classList.add('shake');q.typed='';show();fb.className='fb bad';
      if(q.tries===1){fb.innerHTML='¡Casi! Mira la pista y vuelve a intentarlo.';if(!q.hint)showHint();}
      else{q.revealed=true;fb.innerHTML='La respuesta es <b>'+q.ans+'</b>. Escríbela tú para que se te quede.';if(hintEl.hidden)showHint();}
      arm();
    }
  }
  var ctl={
    press:function(k){if(q.done)return;arm();if(k==='del'){q.typed=q.typed.slice(0,-1);show();}else if(k==='ok'){check();}else if(/^\d$/.test(k)&&q.typed.length<3){q.typed=(q.typed==='0'?'':q.typed)+k;show();sfx('tap');}},
    hint:function(){if(!q.hint&&!q.done){showHint();arm();}},
    say:function(){if(!sayQ('¿Cuánto es '))toast('Este dispositivo no puede leer en voz alta.');arm();}
  };
  activeQ=ctl;arm();
  if(state.voice&&state.sound)setTimeout(function(){if(activeQ===ctl)sayQ('');},300);
  return ctl;
}

/* ---------- Confeti de pintura ---------- */
function confetti(){
  if(reduced())return;
  var c=$('#confetti'),ctx=c.getContext&&c.getContext('2d');if(!ctx)return;
  var W=window.innerWidth,H=window.innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=W*dpr;c.height=H*dpr;c.hidden=false;
  var P=range(1,110).map(function(){return {x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3,r:4+Math.random()*7,c:COLORS[Math.floor(Math.random()*13)][0],rot:Math.random()*6};});
  var t0=null;
  function f(t){if(t0===null)t0=t;var el=t-t0;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.78,p.rot,0,Math.PI*2);ctx.fill();});
    if(el<3200)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);c.hidden=true;}}
  requestAnimationFrame(f);
}

  speak:function(){speakTable(curT);},
  key:function(v){if(activeQ)activeQ.press(v);},
  hint:function(){if(activeQ)activeQ.hint();},
  closeSheet:function(){cancelSheet();},
  celPick:function(){$('#celebrate').hidden=true;go('pick');},
  celWorks:function(){$('#celebrate').hidden=true;go('works');},
  celStay:function(){$('#celebrate').hidden=true;},
  cfOk:function(){var f=cfFn;closeConfirm();if(f)f();},
  cfNo:function(){closeConfirm();},
  heat:function(v,el){var p=v.split(','),r=+p[0],c=+p[1],f=state.facts[fk(r,c)],st=status(f);$$('.hc.sel').forEach(function(x){x.classList.remove('sel');});el.classList.add('sel');
    $('#heat-info').innerHTML='<b>'+r+' × '+c+' = '+(r*c)+'</b> · '+STL[st]+' · '+(f?f.c+' '+(f.c===1?'vez':'veces')+' bien a la primera, '+f.w+' con error':'todavía no le ha salido en el juego');},
  resetAll:function(){confirmBox('¿Seguro? Se borran las estrellas, el avance y los dibujos guardados en este dispositivo.','Sí, borrar todo',function(){var keep=state.name;state=DEFAULT();state.name=keep;save();renderParents();updateBar();toast('Listo, empezamos de cero.');});}
};

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el)return;
  var fn=A[el.dataset.act];if(fn)fn(el.dataset.v,el,e);
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='name-form'){var v=$('#name-in').value.trim().slice(0,16);if(v){state.name=v;save();renderHome();sfx('good');toast('¡Mucho gusto, '+esc(v)+'!');}}
  else if(f.id==='p-name'){state.name=$('#p-name-in').value.trim().slice(0,16);save();renderParents();toast('Nombre guardado.');}
});
document.addEventListener('keydown',function(e){
  if(!activeQ||!$('#confirm').hidden)return;
  var tag=(e.target&&e.target.tagName||'').toLowerCase();if(tag==='input')return;
  if(/^[0-9]$/.test(e.key)){activeQ.press(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){activeQ.press('del');e.preventDefault();}
  else if(e.key==='Enter'){activeQ.press('ok');e.preventDefault();}
  else if(e.key==='Escape'&&!$('#sheet').hidden){cancelSheet();}
});

/* ---------- Arranque ---------- */
function boot(data){
  state=(data&&data.state)?Object.assign(DEFAULT(),data.state):load();
  go('home');
}
try{var hot=window.claude&&window.claude.hot;if(hot&&hot.snapshot)hot.snapshot(function(){return {state:state};});}catch(e){}
try{
  var h=window.claude&&window.claude.hot;
  if(h&&h.ready)h.ready(boot);else boot(h&&h.data?h.data:{});
}catch(e){boot({});}
})();
</script>
